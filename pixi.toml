[workspace]
authors = ["Chris Barker <Chris.Barker@noaa.gov>"]
channels = ["conda-forge"]
name = "gridded"
platforms = ["win-64", "linux-64", "osx-arm64", "osx-64"]

[dependencies]
python = ">=3.12,<3.15"
netCDF4 = ">=1.4"
numpy = "*"
scipy = "*"
cell_tree2d = ">=0.3"
cftime = "*"
python-dateutil = "*"
pooch = ">=1.9.0,<2"


[feature.dev.dependencies]
ipython = "*"
matplotlib = "*"
ruff = "*"

[feature.dev.pypi-dependencies]
gridded = { path = ".", editable = true }

[feature.build.dependencies]
git = "*" # git may not be there on the CI -- needed for setuptools_scm
pip = "*"
python-build = "*"
hatch = ">=1.16.5"
hatch-vcs = "*"

[feature.docs.dependencies]
sphinx = ">=8.2.3"
sphinx-rtd-theme = "*"

[feature.test.dependencies]
pytest = "*"
pytest-cov = "*"

[feature.py312.dependencies]
python = "~=3.12.0"

[feature.py313.dependencies]
python = "~=3.13.0"

[feature.py314.dependencies]
python = "~=3.14.0"

[environments]
# using the oldest supported version for development
default = { features = ["py312", "dev", "test", "build", "docs"], solve-group = "default" }

dev312 = ["py312", "dev", "test", "build", "docs"]
dev313 = ["py313", "dev", "test", "build", "docs"]
dev314 = ["py314", "dev", "test", "build", "docs"]
build = ["py312", "build"]
docs = ["py312", "docs", "build"]
test312 = [ "py312", "test", "build"]
test313 = [ "py313", "test", "build"]
test314 = [ "py314", "test", "build"]

[tasks]
install = { cmd = "pip install -v --no-deps --root-user-action=ignore ./", default-environment = "build"}

build_wheel = {cmd = "python -m build ./", default-environment = "build"}

build_docs = {cmd = "cd docs && make html", default-environment = "docs", depends-on = [{ task = "install", environment = "docs" }] }

test = { cmd = "pytest --cov=gridded  --pyargs gridded", depends-on = ["install"] }

lint = { cmd = "ruff check gridded", default-environment = "dev"}


