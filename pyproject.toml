[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "gridded"
dynamic = ["version"]
description = "Unified API for working with results from (Met/Ocean) models on various grid types"
readme = "README.rst"
license = "CC0-1.0"
requires-python = ">=3.12"
authors = [
    { name = "Chris Barker", email = "chris.barker@noaa.gov"},
    { name = "Jay Hennen", email = "jay.hennen@noaa.gov"},
]
dependencies = [
    "netCDF4>=1.4",
    "numpy>=2",
]

[project.urls]
Download = "https://github.com/NOAA-ORR-ERD/gridded"
Homepage = "https://github.com/NOAA-ORR-ERD/gridded"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "gridded/_version.py"

[tool.hatch.build.targets.sdist]
include = [
    "/gridded",
]

[tool.ruff]
builtins = ["ellipsis"]
# extend-exclude = ["xarray_subset_grid/_version.py"]
target-version = "py312"
# Use a longer line length.
line-length = 120


[tool.ruff.lint]
ignore = [
  "E402", # module level import not at top of file
  "E731", # do not assign a lambda expression, use a def
]
select = [
#  "SIM",  # flake8 simplify -- maybe use in the future -- particularly when there are complete tests.
  "F",   # Pyflakes --
  "E",   # Pycodestyle
  "W",   # Pycodestle whitespace issues
  "TID", # flake8-tidy-imports (absolute imports)
  "I",   # isort
  "UP",  # Pyupgrade
]

extend-safe-fixes = [
  "TID252", # absolute imports
]
unfixable = ["F401",  # unused imports -- messes up pytest fixtures
             "F811"]  # redefinition -- messes up pytest fixtures

[tool.ruff.lint.pycodestyle]
# Set your target maximum length for docstrings
max-doc-length = 120


[tool.ruff.lint.per-file-ignores]
# Ignore specific rules (e.g., S101 for asserts, D for docstrings) in all test files
"gridded/tests/**/*.py" = ["F811", "F401"]  # fixtures confuse ruff
"*__init__.py" = ["I001"] # , "F401", ]

# Note: docformatter is not run regularly
#       as part of the workflow -- but here are the settings
#       that were used to do bulk-cleanup on 11/02/2026
[tool.docformatter]
style = "sphinx"
recursive = true
in-place = true
wrap-summaries = 100  # that's what the code line length is set to.
wrap-descriptions = 80  # keeps it a bit more manageable
tab-width = 4
blank = true
pre-summary-newline = true
pre-summary-space = false  # does not work well (and is uneccesary) with make-summary-multi-line
close-quotes-on-newline = true
make-summary-multi-line = true
