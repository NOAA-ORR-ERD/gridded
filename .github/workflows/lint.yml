name: Linting

on: [push, pull_request]

jobs:
  lint:
    name: linting

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Pixi Environment
      uses: prefix-dev/setup-pixi@v0.10.1
      with:
        cache: true
        manifest-path: pixi.toml
        environments: dev312

    - name: Lint
#      working-directory:
#      continue-on-error: true
      run: pixi run lint
